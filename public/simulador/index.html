<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Simulador · La Birriaza</title>
<link rel="icon" href="/img/logo.png">
<style>
:root{--head:#075e54;--out:#d9fdd3;--in:#fff;--bg:#efeae2;--green:#00a884;--ink:#111b21;--muted:#667781}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#d1d7db;display:flex;justify-content:center}
.phone{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
header{background:var(--head);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:60px}
header img{width:40px;height:40px;border-radius:50%;background:#f1ece4;object-fit:cover}
header .n{flex:1}header b{display:block;font-size:16.5px}header span{font-size:12.5px;opacity:.85}
header button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;min-height:36px}
.banner{background:#fff3c4;color:#5c4400;font-size:12.5px;padding:8px 12px;text-align:center}
.chat{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:4px;background-image:radial-gradient(rgba(0,0,0,.035) 1.2px,transparent 1.3px);background-size:18px 18px}
.m{max-width:85%;padding:6px 9px 7px;border-radius:8px;font-size:14.6px;line-height:1.38;color:var(--ink);box-shadow:0 1px .5px rgba(11,20,26,.13);white-space:pre-wrap;word-wrap:break-word}
.m.in{align-self:flex-start;background:var(--in)}
.m.out{align-self:flex-end;background:var(--out)}
.m .t{display:block;text-align:right;font-size:11px;color:var(--muted);margin-top:2px}
.iw{align-self:flex-start;width:85%;display:flex;flex-direction:column;gap:2px}
.iw .m{max-width:none}
.opt{background:#fff;color:#00a884;border:0;font:inherit;font-weight:500;font-size:14.6px;padding:10px;border-radius:6px;box-shadow:0 1px .5px rgba(11,20,26,.13);cursor:pointer;min-height:44px}
.opt:disabled{color:#9db8b2;cursor:default}
.m img{max-width:100%;border-radius:6px;display:block}
.bar{display:flex;gap:6px;padding:6px 6px 10px;align-items:center}
.bar form{flex:1;display:flex;background:#fff;border-radius:24px;padding:0 6px 0 14px;align-items:center;min-height:46px}
.bar input{flex:1;border:0;font:inherit;font-size:16px;outline:none;background:transparent;min-width:0}
.icon{width:44px;height:44px;border-radius:50%;border:0;background:transparent;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#54656f}
.send{background:var(--green);color:#fff}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.42);display:none;flex-direction:column;justify-content:flex-end}
.ov.on{display:flex}
.sheet{background:#fff;border-radius:18px 18px 0 0;max-height:80%;overflow:auto;padding-bottom:14px}
.sh{display:flex;align-items:center;gap:14px;padding:16px 18px 6px;font-size:17px;font-weight:600}
.sh button{border:0;background:transparent;font-size:22px;color:#54656f;min-width:44px;min-height:44px;cursor:pointer}
.sec{font-size:13px;color:#008069;font-weight:600;padding:10px 20px 4px}
.row{display:flex;width:100%;text-align:left;align-items:center;padding:9px 20px;gap:10px;border:0;background:transparent;font:inherit;cursor:pointer;min-height:48px}
.row:hover{background:#f5f6f6}
.row .tx{flex:1;font-size:15px;color:var(--ink)}.row small{display:block;font-size:13px;color:var(--muted)}
.start{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.start form{background:#fff;border-radius:16px;padding:24px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
.start img{width:80px;height:80px;border-radius:50%;margin:0 auto}
.start input{font:inherit;padding:12px;border:1px solid #ccd;border-radius:10px;font-size:16px}
.start button{border:0;background:var(--green);color:#fff;font:inherit;font-weight:600;padding:14px;border-radius:24px;cursor:pointer}
</style>
</head>
<body>
<div class="phone">
  <header>
    <img src="/img/logo.png" alt="">
    <div class="n"><b>La Birriaza</b><span>Simulador de pedidos</span></div>
    <button id="reset" type="button">Reiniciar</button>
  </header>
  <div class="banner">Simulador de prueba: los pedidos se marcan como <b>PRUEBA</b>.</div>
  <div class="chat" id="chat" aria-live="polite"></div>
  <div class="bar">
    <button class="icon" id="clip" type="button" title="Enviar comprobante de transferencia" aria-label="Enviar comprobante">📎</button>
    <form id="f"><input id="txt" placeholder="Mensaje" autocomplete="off" aria-label="Mensaje"></form>
    <button class="icon send" id="sendBtn" type="button" aria-label="Enviar">➤</button>
  </div>
  <div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
  <div class="start" id="start">
    <form id="sf">
      <img src="/img/logo.png" alt="Logotipo de La Birriaza">
      <b style="font-size:18px">Prueba el bot de pedidos</b>
      <span style="font-size:14px;color:#54656f">Así lo verá tu cliente en WhatsApp. Escribe tu nombre como aparece en tu perfil.</span>
      <input id="nm" placeholder="Tu nombre" required maxlength="40" aria-label="Tu nombre">
      <button type="submit">Empezar conversación</button>
    </form>
  </div>
</div>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const chat = $('#chat');
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  let cliente = store.get('simCliente');
  if (!cliente) { cliente = Math.random().toString(36).slice(2, 12); store.set('simCliente', cliente); }
  let nombre = store.get('simNombre') || '';
  let desde = Date.now();
  let busy = false;

  const hora = () => new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: false });
  const bold = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])).replace(/\*([^*\n]+)\*/g, '<b>$1</b>');
  const scroll = () => { chat.scrollTop = chat.scrollHeight; };

  function bubble(side, html) {
    const d = document.createElement('div');
    d.className = 'm ' + side;
    d.innerHTML = html + `<span class="t">${hora()}${side === 'out' ? ' ✓✓' : ''}</span>`;
    return d;
  }

  function disableOld() { chat.querySelectorAll('.opt').forEach((b) => (b.disabled = true)); }

  function renderBot(msg) {
    if (msg.type === 'text') chat.append(bubble('in', bold(msg.body)));
    else if (msg.type === 'image') chat.append(bubble('in', `<img src="${msg.path}" alt="Datos de pago">` + (msg.caption ? `<div style="margin-top:6px">${bold(msg.caption)}</div>` : '')));
    else if (msg.type === 'buttons' || msg.type === 'list' || msg.type === 'location_request') {
      const w = document.createElement('div');
      w.className = 'iw';
      w.append(bubble('in', bold(msg.body)));
      if (msg.type === 'buttons') {
        for (const b of msg.buttons) {
          const el = document.createElement('button');
          el.className = 'opt'; el.type = 'button'; el.textContent = '↩ ' + b.title;
          el.onclick = () => send({ tipo: 'opcion', opcion: b.id, titulo: b.title }, b.title);
          w.append(el);
        }
      } else if (msg.type === 'list') {
        const el = document.createElement('button');
        el.className = 'opt'; el.type = 'button'; el.textContent = '☰ ' + msg.button;
        el.onclick = () => openList(msg);
        w.append(el);
      } else {
        const el = document.createElement('button');
        el.className = 'opt'; el.type = 'button'; el.textContent = '📍 Enviar ubicación';
        el.onclick = sendLocation;
        w.append(el);
      }
      chat.append(w);
    }
    scroll();
  }

  function openList(msg) {
    const sheet = $('#sheet');
    sheet.innerHTML = `<div class="sh"><button type="button" aria-label="Cerrar">✕</button>${bold(msg.button)}</div>`;
    sheet.querySelector('button').onclick = closeList;
    for (const s of msg.sections) {
      if (s.title) { const h = document.createElement('div'); h.className = 'sec'; h.textContent = s.title; sheet.append(h); }
      for (const r of s.rows) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'row';
        b.innerHTML = `<span class="tx"></span>`;
        b.querySelector('.tx').textContent = r.title;
        if (r.description) { const sm = document.createElement('small'); sm.textContent = r.description; b.querySelector('.tx').append(sm); }
        b.onclick = () => { closeList(); send({ tipo: 'opcion', opcion: r.id, titulo: r.title }, r.title + (r.description ? '\n' + r.description : '')); };
        sheet.append(b);
      }
    }
    $('#ov').classList.add('on');
  }
  function closeList() { $('#ov').classList.remove('on'); }
  $('#ov').addEventListener('click', (e) => { if (e.target.id === 'ov') closeList(); });

  async function send(body, shown) {
    if (busy) return;
    busy = true;
    disableOld();
    if (shown !== null) chat.append(bubble('out', bold(shown)));
    scroll();
    try {
      const res = await fetch('/api/simulador/mensaje', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cliente, nombre, ...body }) });
      const j = await res.json();
      for (const m of j.replies) { await new Promise((r) => setTimeout(r, 350)); renderBot(m); }
    } catch (e) {
      chat.append(bubble('in', 'No hay conexión con el servidor.'));
    } finally { busy = false; }
  }

  function sendLocation() {
    const go = (lat, lng) => {
      const html = `📍 Ubicación compartida<br><small style="color:#54656f">${lat.toFixed(5)}, ${lng.toFixed(5)}</small>`;
      disableOld();
      chat.append(bubble('out', html));
      send({ tipo: 'ubicacion', lat, lng }, null);
    };
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition((p) => go(p.coords.latitude, p.coords.longitude), () => go(19.8869, -97.4943), { timeout: 6000 });
    } else go(19.8869, -97.4943);
  }

  $('#clip').onclick = () => {
    disableOld();
    chat.append(bubble('out', `<img src="/img/comprobante-ejemplo.svg" alt="Comprobante" style="max-width:180px">`));
    send({ tipo: 'comprobante' }, null);
  };

  const sendText = () => {
    const v = $('#txt').value.trim();
    if (!v) return;
    $('#txt').value = '';
    send({ tipo: 'texto', texto: v }, v);
  };
  $('#f').onsubmit = (e) => { e.preventDefault(); sendText(); };
  $('#sendBtn').onclick = sendText;

  async function restart() {
    await fetch('/api/simulador/reiniciar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cliente }) }).catch(() => {});
    chat.innerHTML = '';
    send({ tipo: 'texto', texto: 'Hola, me gustaría hacer un pedido.' }, 'Hola, me gustaría hacer un pedido.');
  }
  $('#reset').onclick = restart;

  // Avisos del restaurante (cuando cambian el estado del pedido en el panel)
  setInterval(async () => {
    try {
      const j = await (await fetch(`/api/simulador/avisos?cliente=${cliente}&desde=${desde}`)).json();
      for (const it of j.items) { desde = Math.max(desde, it.ts); renderBot(it.msg); }
    } catch (e) {}
  }, 5000);

  function begin() {
    $('#start').remove();
    restart();
  }
  if (nombre) begin();
  else $('#sf').onsubmit = (e) => { e.preventDefault(); nombre = $('#nm').value.trim(); store.set('simNombre', nombre); begin(); };
})();
</script>
</body>
</html>
